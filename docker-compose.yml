version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: formflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  backend:
    image: ${DOCKERHUB_USERNAME}/formflow-backend:${APP_VERSION}
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: formflow
    depends_on:
      - db

  frontend:
    image: ${DOCKERHUB_USERNAME}/formflow-frontend:${APP_VERSION}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend