name: Deploy FormFlow 3-Tier App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Frontend
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/formflow-frontend:${{ github.sha }} ./frontend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/formflow-frontend:${{ github.sha }}

    - name: Build and Push Backend
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/formflow-backend:${{ github.sha }} ./backend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/formflow-backend:${{ github.sha }}

    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        port: 22
        script: |
          set -e

          echo "Connected to server successfully"

          mkdir -p ~/app
          cd ~/app

          echo "Downloading docker-compose.yml..."
          curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml

          echo "Creating .env file..."
          echo "APP_VERSION=${{ github.sha }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

          echo "Checking Docker installation..."
          docker --version
          docker compose version

          echo "Pulling latest images from Docker Hub..."
          docker compose pull

          echo "Starting containers..."
          docker compose up -d --remove-orphans

          echo "Deployment completed successfully"