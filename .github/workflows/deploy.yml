name: Deploy FormFlow 3-Tier App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Frontend
      run: |
        docker build -t ayomiide/formflow-frontend:${{ github.sha }} ./frontend
        docker push ayomiide/formflow-frontend:${{ github.sha }}

    - name: Build and Push Backend
      run: |
        docker build -t ayomiide/formflow-backend:${{ github.sha }} ./backend
        docker push ayomiide/formflow-backend:${{ github.sha }}

    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          mkdir -p ~/app
          cd ~/app
          
          # Write docker-compose.yml from repo to VM
          curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
          
          # Update the .env file with the current Commit SHA and Secrets
          echo "APP_VERSION=${{ github.sha }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          
          # Pull the new images and restart the containers
          docker-compose pull
          docker-compose up -d --remove-orphans